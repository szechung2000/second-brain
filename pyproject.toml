[project]
name = "second-brain"
version = "0.1.0"
description = "Offline, provenance-first Obsidian ingestion adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pypdf>=5.0"]

[project.scripts]
sb = "second_brain.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
